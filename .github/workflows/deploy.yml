name: Deploy to Cloudflare Pages

# Auto-deploy on every push to master (the old DigitalOcean App Platform
# git-deploy equivalent). Builds the Astro app in web/ and uploads to the
# existing "annies-havens" Pages project via wrangler. Runtime secrets
# (RESEND_TOKEN, TURNSTILE_SECRET_KEY, CONTACT_TO/FROM) live on the Pages
# project and are preserved across deploys.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: web
        env:
          # Public Turnstile site key — baked into the client HTML at build time.
          # Not a secret (it's visible in the page source either way).
          PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADZOPrSVP-tOzqUk"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=annies-havens --branch=main
