name: Deploy to Cloudflare Workers

# Auto-deploy on every push to master. Builds the Astro app in web/ and
# deploys it to Cloudflare Workers (static assets + the contact-form route)
# via wrangler, using the config the @astrojs/cloudflare adapter emits at
# dist/server/wrangler.json. Runtime secrets (RESEND_TOKEN,
# TURNSTILE_SECRET_KEY, CONTACT_TO/FROM) live on the Worker and persist across
# deploys.
#
# Pull requests into master run the same type check and build, without
# deploying, so a change is known to build before it merges.
#
# NOTE: Astro 6+ / @astrojs/cloudflare v13+ dropped Cloudflare Pages support;
# this site moved from a Pages project to a Worker. The Worker is named
# "annies-havens-web" (from package.json "name"). The CLOUDFLARE_API_TOKEN
# secret must have Workers Scripts:Edit (the old Pages:Edit scope is not
# sufficient for `wrangler deploy`).
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time, in push order; a newer PR push cancels its older run.
# Only master runs share the 'deploy' group, so a manual check on another
# branch can't displace a master deploy that is waiting its turn.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/master' && 'deploy') || format('check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        env:
          # Public Turnstile site key, baked into the client HTML at build time.
          # Not a secret (it's visible in the page source either way).
          PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADZOPrSVP-tOzqUk"
        run: npm run build

      # Deploy with the project's own wrangler (a devDependency, and the peer
      # @astrojs/cloudflare builds against), so the deploy CLI matches the one
      # that generated dist/server/wrangler.json. Only master deploys: a manual
      # run on another branch builds it as a check and stops here.
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
