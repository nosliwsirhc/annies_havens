name: Deploy to Cloudflare Workers

# Auto-deploy on every push to master. Builds the Astro app in web/ and
# deploys it to Cloudflare Workers (static assets + the contact-form route)
# via wrangler, using the config the @astrojs/cloudflare adapter emits at
# dist/server/wrangler.json. Runtime secrets (RESEND_TOKEN,
# TURNSTILE_SECRET_KEY, CONTACT_TO/FROM) live on the Worker and persist across
# deploys.
#
# NOTE: Astro 6 + @astrojs/cloudflare v13 dropped Cloudflare Pages support;
# this site moved from a Pages project to a Worker. The Worker is named
# "annies-havens-web" (from package.json "name"). The CLOUDFLARE_API_TOKEN
# secret must have Workers Scripts:Edit (the old Pages:Edit scope is not
# sufficient for `wrangler deploy`).
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: web
        env:
          # Public Turnstile site key — baked into the client HTML at build time.
          # Not a secret (it's visible in the page source either way).
          PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADZOPrSVP-tOzqUk"
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy --config dist/server/wrangler.json
